name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - baseline_candidate/tests
          - baseline_candidate/online_kaggle/tests
          - baseline_candidate/online_kaggle/submission/tests
          - finetuned_ensemble/tests
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dev.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install development dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Check public files and notebooks
        run: python scripts/check_repository.py
      - name: Run tests with synthetic inputs
        run: python -m pytest ${{ matrix.suite }} -m "not local_assets" -q
